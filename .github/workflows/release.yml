name: Release

# Builds and publishes the prebuilt artifacts install.sh downloads
# (docs/installer.md). Triggered by pushing a tag like v0.1.0 -- the tag
# name (minus the leading "v") becomes the release version, injected into
# the agentd binary via -ldflags (agent/cmd/agentd/main.go's suiteVersion/
# agentVersion are `var`, not `const`, specifically so this works).
on:
  push:
    tags:
      - 'v*'

jobs:
  dashboard:
    name: Build dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build
        working-directory: dashboard
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist

  build:
    name: Build agentd (${{ matrix.goarch }})
    needs: dashboard
    strategy:
      matrix:
        include:
          # cgo (agent/storage/sqlite, ADR-001) means these binaries are
          # dynamically linked against the build host's glibc -- so build
          # on the OLDEST glibc among the supported targets
          # (docs/installer.md's platform list: Ubuntu 22.04/24.04, Debian
          # 12, Raspberry Pi OS) so the result runs on all of them, not
          # just the newest. Ubuntu 22.04 = glibc 2.35, which predates
          # Debian 12's 2.36 and Ubuntu 24.04's 2.39. GitHub's ARM64
          # hosted runners are ubuntu-22.04-arm / ubuntu-24.04-arm; if
          # ubuntu-22.04-arm isn't available on this repo's plan, the
          # Docker smoke tests (installer/test/) against ubuntu:22.04,
          # ubuntu:24.04, and debian:12 are what will catch it.
          - goarch: amd64
            runs-on: ubuntu-22.04
          - goarch: arm64
            runs-on: ubuntu-22.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false # no go.sum exists at all (ADR-001)

      - name: Install libsqlite3-dev
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Compute version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      - name: Build agentd
        working-directory: agent
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.suiteVersion=${{ steps.version.outputs.version }} -X main.agentVersion=${{ steps.version.outputs.version }}" \
            -o ../agentd ./cmd/agentd

      - name: Verify binary architecture
        run: |
          file ./agentd
          [[ "${{ matrix.goarch }}" == "amd64" ]] && expect="x86-64" || expect="ARM aarch64"
          file ./agentd | grep -q "$expect" || { echo "built binary does not match expected arch $expect"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard-dist

      - name: Package release tarball
        run: |
          pkg="qrx-node-suite_${{ steps.version.outputs.version }}_linux_${{ matrix.goarch }}"
          mkdir -p "$pkg/dashboard"
          cp agentd "$pkg/agentd"
          chmod 0755 "$pkg/agentd"
          cp -a dashboard-dist/. "$pkg/dashboard/"
          cp LICENSE "$pkg/LICENSE"
          cp installer/linux/uninstall.sh "$pkg/uninstall.sh"
          chmod 0755 "$pkg/uninstall.sh"
          cp installer/qrx-core-sources.sh "$pkg/qrx-core-sources.sh"
          chmod 0755 "$pkg/qrx-core-sources.sh"
          echo "${{ steps.version.outputs.version }}" > "$pkg/VERSION"
          # -C "$pkg" . (not `tar -czf x.tar.gz "$pkg"`) so the tarball has
          # no wrapping directory -- install.sh's install_release() expects
          # agentd, dashboard/, etc. directly at the archive root.
          tar -czf "${pkg}.tar.gz" -C "$pkg" .
          echo "ASSET_NAME=${pkg}.tar.gz" >>"$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.goarch }}
          path: ${{ env.ASSET_NAME }}

      # Published separately from the tarball above (not just extracted
      # from it downstream) because the OTA "agent" component's artifact
      # is a raw binary -- components.Agent.Extract writes an update
      # artifact straight to disk as-is, with no untarring step, unlike
      # the tarball this same build also produces for install.sh's initial
      # install. See the "release" job's "Build OTA update manifests"
      # step, which points the agent component's URL at this asset.
      - uses: actions/upload-artifact@v4
        with:
          name: agentd-linux-${{ matrix.goarch }}
          path: agentd

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Job-level, not step-level: a step's `if:` can read env.* set at the
    # job (or workflow) level, but NOT env.* set in that same step's own
    # `env:` block (an earlier version of this workflow had that bug: `if:
    # env.X != ''` on a step whose own `env:` defined X was always false).
    # secrets.* itself must never appear directly in an `if:` expression --
    # GitHub's own docs (docs.github.com/en/actions/how-tos/write-workflows/
    # choose-what-workflows-do/use-secrets) say to set the secret as a
    # job-level environment variable first and condition on that instead;
    # an external re-review (R01) caught that this workflow got that part
    # wrong. This is that fix.
    env:
      RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
      # Deliberately a separate secret from RELEASE_SIGNING_PRIVATE_KEY --
      # see docs/deployment.md#signing-keys and install.sh's
      # QRX_TRUSTED_MANIFEST_PUBLIC_KEY_B64 comment for why these two
      # signing flows (release tarball vs. OTA update manifest) are kept
      # on independent keypairs.
      MANIFEST_SIGNING_PRIVATE_KEY: ${{ secrets.MANIFEST_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true

      # Downloaded to their own directories, not straight into dist/ --
      # both agentd-linux-amd64 and agentd-linux-arm64 artifacts contain a
      # file literally named "agentd" (the raw binary upload_artifact
      # step in the "build" job above), so a shared destination would have
      # the second download silently overwrite the first.
      - uses: actions/download-artifact@v4
        with:
          name: agentd-linux-amd64
          path: raw/amd64
      - uses: actions/download-artifact@v4
        with:
          name: agentd-linux-arm64
          path: raw/arm64
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard-dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      # `if:` conditions here read env.RELEASE_SIGNING_PRIVATE_KEY (set at
      # job level above), never secrets.RELEASE_SIGNING_PRIVATE_KEY
      # directly -- GitHub's docs say a secret must be assigned to a
      # job/workflow-level env var before it can be used in a step's `if:`
      # (docs.github.com/en/actions/how-tos/write-workflows/choose-what-
      # workflows-do/use-secrets). An earlier version of this workflow had
      # the OPPOSITE bug (a step's own `env:` block isn't visible to that
      # same step's `if:`, so "Sign checksums" never ran and "Fail if
      # unsigned" always did); moving the assignment to job level fixes
      # both problems at once.
      - name: Sign checksums
        if: ${{ env.RELEASE_SIGNING_PRIVATE_KEY != '' }}
        run: |
          # A private key temp file should never sit at a fixed, guessable
          # /tmp path any other process on the runner could read before
          # cleanup, and cleanup must run even if signing itself fails --
          # mktemp (private to this process, 0600 by default) plus a trap
          # covers both.
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          echo "$RELEASE_SIGNING_PRIVATE_KEY" > "$key_file"
          # sign-checksums has no go.mod at the repo root (only under
          # agent/) -- must run from there, with absolute paths for the
          # dist/ files it reads/writes since $PWD changes.
          (cd agent && go run ./cmd/sign-checksums \
            -key "$key_file" \
            -in "${GITHUB_WORKSPACE}/dist/SHA256SUMS" \
            -out "${GITHUB_WORKSPACE}/dist/SHA256SUMS.sig")

      # install.sh (docs/installer.md#release-security) hard-requires a
      # valid signature for any GitHub-sourced release -- it will not
      # install this release at all without RELEASE_SIGNING_PRIVATE_KEY
      # configured, so an unsigned release here is not a soft warning,
      # it's a broken release. Fail the job rather than publish one.
      - name: Fail if unsigned
        if: ${{ env.RELEASE_SIGNING_PRIVATE_KEY == '' }}
        run: |
          echo "::error::RELEASE_SIGNING_PRIVATE_KEY repo secret is not set. install.sh refuses to install an unsigned release (docs/installer.md#release-security) -- publishing one now would produce a release nobody can actually install via the documented one-line command. Set the secret before tagging a release; see docs/deployment.md#signing-keys."
          exit 1

      # Assembles the raw artifacts the OTA manifests below point at:
      # components.Agent.Extract writes a self-update artifact straight to
      # disk as-is (no untarring), so the "agent" component needs the bare
      # binary, not the install.sh-oriented tarball; components.Dashboard.
      # Extract expects a tar.gz of just the static assets (no wrapping
      # directory beyond what's already in dashboard-dist/), also not the
      # combined install.sh tarball.
      - name: Prepare OTA update artifacts
        run: |
          cp raw/amd64/agentd dist/agentd-linux-amd64
          cp raw/arm64/agentd dist/agentd-linux-arm64
          chmod 0755 dist/agentd-linux-amd64 dist/agentd-linux-arm64
          tar -czf dist/dashboard.tar.gz -C dashboard-dist .

      # One manifest per architecture, not a shared manifest.json: the
      # "agent" component's artifact is architecture-specific (see
      # cmd/agentd/sources.go's buildUpdateSource, which asks for
      # manifest-linux-<GOARCH>.json), while manifest.Manifest itself has
      # no per-architecture field. "dashboard" is architecture-independent
      # (same tar.gz, same checksum, listed in both).
      - name: Build OTA update manifests
        run: |
          version="${GITHUB_REF_NAME#v}"
          released_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          repo="${{ github.repository }}"
          tag="${{ github.ref_name }}"
          dashboard_sha="$(sha256sum dist/dashboard.tar.gz | cut -d' ' -f1)"
          dashboard_url="https://github.com/${repo}/releases/download/${tag}/dashboard.tar.gz"

          for arch in amd64 arm64; do
            agent_sha="$(sha256sum "dist/agentd-linux-${arch}" | cut -d' ' -f1)"
            agent_url="https://github.com/${repo}/releases/download/${tag}/agentd-linux-${arch}"
            jq -n \
              --arg suite_version "$version" \
              --arg released_at "$released_at" \
              --arg agent_url "$agent_url" --arg agent_sha "$agent_sha" \
              --arg dash_url "$dashboard_url" --arg dash_sha "$dashboard_sha" \
              '{
                manifest_version: 1,
                channel: "stable",
                suite_version: $suite_version,
                released_at: $released_at,
                components: {
                  agent: {version: $suite_version, url: $agent_url, sha256: $agent_sha, signature: ""},
                  dashboard: {version: $suite_version, url: $dash_url, sha256: $dash_sha, signature: ""}
                },
                manifest_signature: ""
              }' >"dist/manifest-linux-${arch}.json"
          done

      # Same job-level-env-then-step-if pattern as "Sign checksums" above
      # (R01) -- MANIFEST_SIGNING_PRIVATE_KEY is a separate secret from
      # RELEASE_SIGNING_PRIVATE_KEY (docs/deployment.md#signing-keys).
      - name: Sign OTA update manifests
        if: ${{ env.MANIFEST_SIGNING_PRIVATE_KEY != '' }}
        run: |
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          echo "$MANIFEST_SIGNING_PRIVATE_KEY" > "$key_file"
          for arch in amd64 arm64; do
            (cd agent && go run ./cmd/sign-manifest \
              -key "$key_file" \
              -manifest "${GITHUB_WORKSPACE}/dist/manifest-linux-${arch}.json" \
              -out "${GITHUB_WORKSPACE}/dist/manifest-linux-${arch}.json")
          done

      # Same reasoning as "Fail if unsigned" above: an installed Agent's
      # manifest.VerifyManifestSignature fails closed (ErrNoPublicKey/
      # invalid signature) on an unsigned manifest -- publishing one now
      # would produce a release that installs fine but can never
      # self-update, silently reintroducing the exact gap the R05 fix
      # closed. Fail the job rather than publish that.
      - name: Fail if OTA manifests are unsigned
        if: ${{ env.MANIFEST_SIGNING_PRIVATE_KEY == '' }}
        run: |
          echo "::error::MANIFEST_SIGNING_PRIVATE_KEY repo secret is not set. Every installed Agent's OTA update manifest verification fails closed without a validly signed manifest (agent/updates/manifest.ErrNoPublicKey) -- publishing this release would produce one nobody can ever self-update from. Set the secret before tagging a release; see docs/deployment.md#signing-keys."
          exit 1

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/agentd-linux-amd64
            dist/agentd-linux-arm64
            dist/manifest-linux-amd64.json
            dist/manifest-linux-arm64.json
          fail_on_unmatched_files: false
          generate_release_notes: true
