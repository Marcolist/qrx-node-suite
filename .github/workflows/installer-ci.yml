name: Installer

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'installer/**'
      - 'agent/cmd/sign-checksums/**'
      - 'agent/cmd/gen-signing-key/**'
      - '.github/workflows/installer-ci.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'installer/**'
      - 'agent/cmd/sign-checksums/**'
      - 'agent/cmd/gen-signing-key/**'
      - '.github/workflows/installer-ci.yml'

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (syntax)
        run: |
          bash -n install.sh
          bash -n installer/linux/install.sh
          bash -n installer/linux/uninstall.sh
          bash -n installer/qrx-core-sources.sh
          bash -n installer/test/test-detection.sh
          bash -n installer/test/test-uninstall.sh
          bash -n installer/test/gen-fixtures.sh
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: dashboard/node_modules
          additional_files: 'install.sh installer/linux/uninstall.sh installer/qrx-core-sources.sh installer/test/test-detection.sh installer/test/test-uninstall.sh installer/test/gen-fixtures.sh'

  unit-tests:
    name: detection unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      # fixtures/sig/ isn't committed with a private key (there isn't one
      # to commit -- gen-fixtures.sh generates and discards a disposable
      # test-only keypair each run), so CI regenerates it fresh; the
      # checked-in fixtures/sig/ in the repo is just for local `bash
      # installer/test/test-detection.sh` convenience without needing Go.
      - name: Regenerate signature fixtures
        run: bash installer/test/gen-fixtures.sh
      - name: Run unit tests
        run: |
          bash installer/test/test-detection.sh
          bash installer/test/test-uninstall.sh

  docker-smoke-test:
    name: Docker smoke test (${{ matrix.image }})
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Install libsqlite3-dev (build dependency, host-side only)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build agentd
        working-directory: agent
        run: go build -o ../agentd ./cmd/agentd

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm install
          npm run build

      - name: Package a local test tarball
        run: |
          pkg="qrx-node-suite_0.0.0-ci_linux_amd64"
          mkdir -p "$pkg/dashboard"
          cp agentd "$pkg/agentd"
          cp -a dashboard/dist/. "$pkg/dashboard/"
          cp LICENSE "$pkg/LICENSE"
          cp installer/linux/uninstall.sh "$pkg/uninstall.sh"
          chmod 0755 "$pkg/uninstall.sh"
          cp installer/qrx-core-sources.sh "$pkg/qrx-core-sources.sh"
          chmod 0755 "$pkg/qrx-core-sources.sh"
          echo "0.0.0-ci" > "$pkg/VERSION"
          # See release.yml's matching comment: no wrapping directory --
          # install.sh expects agentd etc. directly at the archive root.
          tar -czf "${pkg}.tar.gz" -C "$pkg" .
          sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256sums"
          echo "TARBALL=$(pwd)/${pkg}.tar.gz" >>"$GITHUB_ENV"

      - name: Build systemd-capable test image
        run: |
          docker build --build-arg BASE_IMAGE=${{ matrix.image }} \
            -t qrx-installer-test:latest \
            -f installer/test/docker/Dockerfile installer/test/docker

      - name: Start container
        run: |
          docker run -d --name qrx-test --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "${{ github.workspace }}:/workspace:ro" \
            qrx-installer-test:latest
          # Wait for systemd (PID 1 inside the container) to actually be up
          # before exec'ing into it, rather than a fixed sleep.
          for _ in $(seq 1 30); do
            docker exec qrx-test test -d /run/systemd/system && break
            sleep 1
          done
          docker exec qrx-test test -d /run/systemd/system

      - name: Install QRX Node Suite inside the container
        run: |
          docker exec \
            -e QRX_LOCAL_TARBALL=/workspace/$(basename "$TARBALL") \
            -e QRX_INSTALL_QRX_CORE=skip \
            -e QRX_VERBOSE=1 \
            qrx-test bash /workspace/install.sh

      - name: Verify the Agent is actually healthy
        run: |
          docker exec qrx-test systemctl is-active qrx-agent.service
          docker exec qrx-test curl -fsS http://127.0.0.1:8787/health
          docker exec qrx-test systemctl is-enabled qrx-agent.service

      # R05 (external security re-review): confirms install.sh's
      # bootstrap_agent_ota_store actually produced the symlink chain a
      # self-update needs to ever take effect, not just a plain binary
      # copy -- ${QRX_PREFIX}/bin/agentd must resolve into the OTA store's
      # "current" release, or Store.Promote() flipping "current" later
      # would have nothing downstream to affect.
      - name: Verify the OTA store bootstrap
        run: |
          resolved="$(docker exec qrx-test readlink -f /opt/qrx-node-suite/bin/agentd)"
          echo "resolved: $resolved"
          echo "$resolved" | grep -q '/var/lib/qrx-node-suite/components/agent/releases/0.0.0-ci/agentd'

      # Everything from here to "Roll back the self-update" is the actual,
      # end-to-end proof that R05 works: a real self-update install and
      # rollback, against real systemd, in a real (if disposable) OTA
      # store -- not just unit tests around the pieces. source_kind=local
      # (agent/updates/sources.LocalFileSource) stands in for GitHub only
      # as a transport: agent/updates/sources' package doc says the same
      # verification pipeline applies "regardless of source", and this
      # sandbox has no way to stand up a fake GitHub releases API. Every
      # byte downstream of "fetch these bytes" -- manifest/artifact
      # signature verification, Store.Stage/Promote, the
      # ${QRX_PREFIX}/bin/agentd symlink chain, RequestSelfRestart, and
      # cmd/agentd's exit-on-pending-restart -- runs unmodified.
      - name: Build a second agentd version for the self-update test
        run: |
          (cd agent && go build -o ../agentd-b \
            -ldflags "-X main.suiteVersion=0.0.1-ci-b -X main.agentVersion=0.0.1-ci-b" \
            ./cmd/agentd)
          chmod 0755 agentd-b

      - name: Build and sign a local OTA update manifest for the self-update test
        run: |
          agent_sha="$(sha256sum agentd-b | cut -d' ' -f1)"
          jq -n \
            --arg released_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sha "$agent_sha" \
            '{
              manifest_version: 1,
              channel: "stable",
              suite_version: "0.0.1-ci-b",
              released_at: $released_at,
              components: {
                agent: {version: "0.0.1-ci-b", url: "/workspace/agentd-b", sha256: $sha, signature: ""}
              },
              manifest_signature: ""
            }' >ota-manifest.json
          # A disposable test-only keypair, generated fresh for this CI
          # run and discarded at the end -- never the real
          # MANIFEST_SIGNING_PRIVATE_KEY (see release.yml and
          # docs/deployment.md#signing-keys).
          (cd agent && go run ./cmd/gen-signing-key -priv ../ota-signing-key.priv -pub ../ota-signing-key.pub)
          (cd agent && go run ./cmd/sign-manifest \
            -key ../ota-signing-key.priv -manifest ../ota-manifest.json -out ../ota-manifest.json)

      - name: Point the installed Agent at the local OTA test source
        run: |
          docker exec qrx-test cat /etc/qrx-node-suite/agent.json >agent.json.orig
          jq --arg pk "$(cat ota-signing-key.pub)" \
            '.updates.source_kind = "local"
             | .updates.local_manifest_path_template = "/workspace/ota-manifest.json"
             | .updates.public_key_base64 = $pk' \
            agent.json.orig >agent.json.patched
          docker cp agent.json.patched qrx-test:/etc/qrx-node-suite/agent.json
          docker exec qrx-test chown qrx-agent:qrx-agent /etc/qrx-node-suite/agent.json
          docker exec qrx-test chmod 0640 /etc/qrx-node-suite/agent.json
          docker exec qrx-test systemctl restart qrx-agent.service
          for _ in $(seq 1 30); do
            docker exec qrx-test curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec qrx-test curl -fsS http://127.0.0.1:8787/health

      - name: Install the self-update and verify it actually restarts onto the new binary
        run: |
          admin_token="$(docker exec qrx-test jq -r .admin_token /etc/qrx-node-suite/agent.json)"
          docker exec qrx-test curl -fsS -X POST \
            -H "Authorization: Bearer ${admin_token}" \
            -H "Content-Type: application/json" \
            -d '{"component":"agent"}' \
            http://127.0.0.1:8787/api/v1/updates/install | tee install-result.json
          grep -q '"pending_restart":true' install-result.json

          # RequestSelfRestart exits the process shortly after this HTTP
          # response (cmd/agentd/main.go); systemd's Restart=always then
          # starts a fresh one. Poll /api/v1/version rather than a fixed
          # sleep for that restart, and its own health check, to land.
          reported=""
          for _ in $(seq 1 30); do
            reported="$(docker exec qrx-test curl -fsS http://127.0.0.1:8787/api/v1/version 2>/dev/null | jq -r .agent_version 2>/dev/null || true)"
            [[ "$reported" == "0.0.1-ci-b" ]] && break
            sleep 1
          done
          [[ "$reported" == "0.0.1-ci-b" ]] || {
            echo "agent never reported version 0.0.1-ci-b after the self-update (last saw: '$reported')"
            exit 1
          }
          docker exec qrx-test systemctl is-active qrx-agent.service

          # The actual R05 proof: systemd's ExecStart is a fixed path that
          # never changes -- this symlink chain resolving to the newly
          # promoted release is entirely what made the update take effect.
          resolved="$(docker exec qrx-test readlink -f /opt/qrx-node-suite/bin/agentd)"
          echo "resolved: $resolved"
          echo "$resolved" | grep -q '/var/lib/qrx-node-suite/components/agent/releases/0.0.1-ci-b/agentd'

      - name: Roll back the self-update and verify it actually restarts back
        run: |
          admin_token="$(docker exec qrx-test jq -r .admin_token /etc/qrx-node-suite/agent.json)"
          docker exec qrx-test curl -fsS -X POST \
            -H "Authorization: Bearer ${admin_token}" \
            -H "Content-Type: application/json" \
            -d '{"component":"agent"}' \
            http://127.0.0.1:8787/api/v1/updates/rollback | tee rollback-result.json
          grep -q '"pending_restart":true' rollback-result.json

          reported=""
          for _ in $(seq 1 30); do
            reported="$(docker exec qrx-test curl -fsS http://127.0.0.1:8787/api/v1/version 2>/dev/null | jq -r .agent_version 2>/dev/null || true)"
            [[ "$reported" == "0.0.0-ci" ]] && break
            sleep 1
          done
          [[ "$reported" == "0.0.0-ci" ]] || {
            echo "agent never reported version 0.0.0-ci after the rollback (last saw: '$reported')"
            exit 1
          }
          docker exec qrx-test systemctl is-active qrx-agent.service

          resolved="$(docker exec qrx-test readlink -f /opt/qrx-node-suite/bin/agentd)"
          echo "resolved: $resolved"
          echo "$resolved" | grep -q '/var/lib/qrx-node-suite/components/agent/releases/0.0.0-ci/agentd'

      - name: Uninstall (default, keeps nothing to purge -- just checks it runs cleanly)
        run: |
          docker exec qrx-test qrx-node-suite uninstall --yes
          docker exec qrx-test bash -c '! systemctl list-unit-files | grep -q qrx-agent.service'

      - name: Container logs
        # always(), not failure(): a previous attempt at this step used
        # failure() and never actually ran (visible in CI logs as a
        # ~3ms gap straight from the health-check failure to cleanup) for
        # reasons that weren't obvious from the YAML alone -- always()
        # is a small amount of harmless noise on a successful run in
        # exchange for guaranteed diagnostics on a failing one.
        if: always()
        run: |
          docker logs qrx-test || true
          echo "--- qrx-agent.service status ---"
          docker exec qrx-test systemctl status qrx-agent.service --no-pager || true
          echo "--- qrx-agent.service journal ---"
          docker exec qrx-test journalctl -u qrx-agent.service --no-pager || true
          echo "--- install log ---"
          docker exec qrx-test cat /var/log/qrx-node-suite/install.log || true

      - name: Clean up
        if: always()
        run: docker rm -f qrx-test || true
